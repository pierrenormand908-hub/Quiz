<!DOCTYPE html> 
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quiz iPhone 16e</title>
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;}
.iphone16e{width:390px;background:#f2f4f7;border-radius:30px;box-shadow:0 0 40px rgba(0,0,0,.4);overflow:hidden;min-height:100vh;position:relative;}
header{position:fixed;top:0;left:0;width:390px;background:#007aff;color:#fff;padding:15px;text-align:center;font-size:18px;font-weight:bold;z-index:1000;}
.categories{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.categories button{background:#fff;color:#007aff;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:bold;}
.activeCategory{background:#c8f7c5!important;color:#005f2f!important;}
.container{margin-top:170px;margin-bottom:90px;padding:20px;text-align:center;}
.card{background:#fff;padding:25px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.1);max-width:340px;margin:auto;}
#styleBox{font-size:18px;font-weight:bold;color:#007aff;margin-bottom:5px;}
#percentBox{font-size:14px;font-weight:bold;color:#444;margin-bottom:15px;}
button.answer{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:16px;cursor:pointer;}
button.answer:hover{background:#005bb5;}
#result{margin-top:15px;font-size:18px;font-weight:bold;}
#hintBox{margin-top:15px;font-size:16px;font-weight:bold;color:#555;}
nav{position:fixed;bottom:0;left:0;width:390px;background:#fff;border-top:1px solid #ccc;display:flex;justify-content:space-around;padding:10px 0;z-index:1000;}
nav div{text-align:center;font-size:14px;color:#007aff;cursor:pointer;display:flex;align-items:center;gap:5px;}
nav div span.icon{font-size:22px;}
nav div span.count{font-size:14px;font-weight:bold;}
#settingsMenu{position:fixed;bottom:80px;right:20px;background:#fff;padding:15px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.2);display:none;z-index:2000;}
.themeDot{width:25px;height:25px;border-radius:50%;display:inline-block;margin:5px;cursor:pointer;border:2px solid #ccc;}
.confettiCanon{position:fixed;width:10px;height:16px;border-radius:3px;z-index:3000;pointer-events:none;}
</style>
</head>

<body>
<div class="iphone16e">

<header>
  Quiz — Choisis une catégorie
  <div class="categories">
    <button onclick="loadCategory('musique',this)">Musique</button>
    <button onclick="loadCategory('cinema',this)">Cinéma</button>
    <button onclick="loadCategory('series',this)">Séries TV</button>
    <button onclick="loadCategory('acteurs',this)">Acteurs / Actrices</button>
    <button onclick="loadCategory('histoire',this)">Histoire</button>
    <button onclick="loadCategory('faits',this)">Faits divers</button>
  </div>
</header>

<div class="container">
  <div class="card">
    <div id="styleBox">Style : Facile</div>
    <div id="percentBox">Progression : 0%</div>
    <h2 id="questionTitle">Question 1</h2>
    <p id="questionText"></p>
    <div id="answers"></div>
    <p id="result"></p>
    <p id="hintBox"></p>
  </div>
</div>

<nav>
  <div onclick="useHint()"><span class="icon">💡</span><span class="count" id="hintCount">0</span>Indice</div>
  <div onclick="toggleSettings()"><span class="icon">⚙️</span>Paramètres</div>
</nav>

<div id="settingsMenu">
  <div class="themeDot" style="background:#007aff" onclick="changeTheme('#007aff')"></div>
  <div class="themeDot" style="background:#28a745" onclick="changeTheme('#28a745')"></div>
  <div class="themeDot" style="background:#dc3545" onclick="changeTheme('#dc3545')"></div>
  <div class="themeDot" style="background:#6f42c1" onclick="changeTheme('#6f42c1')"></div>
  <div class="themeDot" style="background:#ffc107" onclick="changeTheme('#ffc107')"></div>
</div>

<script>
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const musique={
  facile:[
    {q:"Stayin' Alive ?",a:["ABBA","Bee Gees","Queen"],correct:"Bee Gees",hint:"Frères Gibb."},
    {q:"Like a Virgin ?",a:["Madonna","Cher","Cyndi Lauper"],correct:"Madonna",hint:"Années 80."},
    {q:"Thriller ?",a:["Prince","Michael Jackson","Stevie Wonder"],correct:"Michael Jackson",hint:"Roi de la Pop."},
    {q:"Bohemian Rhapsody ?",a:["Queen","Pink Floyd","Beatles"],correct:"Queen",hint:"Freddie Mercury."},
    {q:"Rolling in the Deep ?",a:["Adele","Rihanna","Sia"],correct:"Adele",hint:"Britannique."}
  ],
  normal:[
    {q:"Album 1977 Bee Gees ?",a:["Saturday Night Fever","Main Course","Spirits"],correct:"Saturday Night Fever",hint:"Disco."},
    {q:"Hotel California ?",a:["Eagles","Fleetwood Mac","Chicago"],correct:"Eagles",hint:"USA."},
    {q:"Purple Rain ?",a:["Prince","Bowie","Elton John"],correct:"Prince",hint:"Couleur."},
    {q:"Another Brick in the Wall ?",a:["Pink Floyd","Queen","Genesis"],correct:"Pink Floyd",hint:"Rock psychédélique."},
    {q:"Teen Spirit ?",a:["Nirvana","Metallica","Pearl Jam"],correct:"Nirvana",hint:"Grunge."}
  ],
  expert:[
    {q:"Mixage Rumours ?",a:["Ken Caillat","Phil Spector","Brian Eno"],correct:"Ken Caillat",hint:"Fleetwood Mac."},
    {q:"Solo Thriller ?",a:["Van Halen","Slash","Clapton"],correct:"Van Halen",hint:"Solo légendaire."},
    {q:"Prophet's Song album ?",a:["Opera","Jazz","Sheer Heart Attack"],correct:"Opera",hint:"Même album que Bohemian Rhapsody."},
    {q:"OK Computer ?",a:["Radiohead","Coldplay","Muse"],correct:"Radiohead",hint:"Rock alternatif."},
    {q:"Space Oddity ?",a:["Bowie","Gabriel","Lou Reed"],correct:"Bowie",hint:"Major Tom."}
  ]
};

let currentCategory=musique,currentStyle="facile",index=0,scoreStyle=0,hintCount=0;

function loadCategory(cat,btn){
  document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("activeCategory"));
  btn.classList.add("activeCategory");
  if(cat==="musique")currentCategory=musique;
  index=0;scoreStyle=0;currentStyle="facile";
  updateStyleDisplay();updatePercentDisplay();updateHintDisplay();loadQuestion();
}

function updateStyleDisplay(){
  document.getElementById("styleBox").innerText="Style : "+currentStyle.charAt(0).toUpperCase()+currentStyle.slice(1);
}

function updatePercentDisplay(){
  let percent=Math.floor((index%5)/5*100);
  document.getElementById("percentBox").innerText="Progression : "+percent+"%";
}

function updateHintDisplay(){
  document.getElementById("hintCount").innerText=hintCount;
}

function loadQuestion(){
  if(index<5)currentStyle="facile";
  else if(index<10)currentStyle="normal";
  else currentStyle="expert";

  updateStyleDisplay();updatePercentDisplay();

  const q=currentCategory[currentStyle][index%5];
  document.getElementById("questionTitle").innerText="Question "+(index+1);
  document.getElementById("questionText").innerText=q.q;

  const answersDiv=document.getElementById("answers");
  answersDiv.innerHTML="";
  shuffle([...q.a]).forEach(ans=>{
    const btn=document.createElement("button");
    btn.className="answer";btn.innerText=ans;
    btn.onclick=()=>check(ans);
    answersDiv.appendChild(btn);
  });

  document.getElementById("result").innerText="";
  document.getElementById("hintBox").innerText="";
}

function check(answer){
  const q=currentCategory[currentStyle][index%5];
  const result=document.getElementById("result");
  if(answer===q.correct){scoreStyle++;result.style.color="green";result.innerText="Bonne réponse !";}
  else{result.style.color="red";result.innerText="Mauvaise réponse.";}

  setTimeout(()=>{
    index++;
    if(index%5===0)checkStyleCompletion();
    if(index<15)loadQuestion();
    else endQuiz();
  },800);
}

function checkStyleCompletion(){
  let percent=(scoreStyle/5)*100;
  if(percent>=70){
    hintCount++;updateHintDisplay();
    alert("🎉 Bravo ! On monte de difficulté !");
    launchConfetti();
  }
  scoreStyle=0;
}

function launchConfetti(){
  const confettiCount=80,gravity=0.25,terminalVelocity=5,drag=0.02;
  for(let i=0;i<confettiCount;i++){
    const conf=document.createElement("div");
    conf.classList.add("confettiCanon");
    const startX=window.innerWidth/2,startY=window.innerHeight-50;
    conf.style.left=startX+"px";conf.style.top=startY+"px";
    const colors=["#ff4757","#1e90ff","#2ed573","#ffa502","#eccc68","#3742fa","#ff6b81"];
    conf.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(conf);

    const angle=(Math.random()*120-60)*(Math.PI/180);
    let velocity=Math.random()*8+8;
    let vx=Math.cos(angle)*velocity,vy=Math.sin(angle)*-velocity;
    let rotation=Math.random()*360,rotationSpeed=(Math.random()-0.5)*10;

    function animate(){
      vy+=gravity;
      velocity=Math.sqrt(vx*vx+vy*vy);
      if(velocity>terminalVelocity){vx*=(1-drag);vy*=(1-drag);}
      const x=parseFloat(conf.style.left)+vx;
      const y=parseFloat(conf.style.top)+vy;
      conf.style.left=x+"px";conf.style.top=y+"px";
      rotation+=rotationSpeed;
      conf.style.transform=`rotate(${rotation}deg)`;
      if(y>window.innerHeight+50)conf.remove();
      else requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }
}

function endQuiz(){
  document.getElementById("questionText").innerText="Quiz terminé ! Tu as obtenu "+hintCount+" indices.";
  document.getElementById("answers").innerHTML="";
}

function useHint(){
  const q=currentCategory[currentStyle][index%5];
  if(hintCount<=0){alert("Aucun indice disponible.");return;}
  document.getElementById("hintBox").innerText="Indice : "+q.hint;
  hintCount--;updateHintDisplay();
}

function toggleSettings(){
  let menu=document.getElementById("settingsMenu");
  menu.style.display=menu.style.display==="block"?"none":"block";
}

function changeTheme(color){
  document.querySelector("header").style.background=color;
  document.querySelectorAll(".categories button").forEach(b=>b.style.color=color);
  document.querySelectorAll("button.answer").forEach(b=>b.style.background=color);
}

loadCategory("musique",document.querySelector(".categories button"));
</script>

</div>
</body>
</html>
