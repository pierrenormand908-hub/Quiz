<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quiz</title>
<link rel="apple-touch-icon" href="Quiz.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:#f2f4f7;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;}
.iphone{width:390px;height:100vh;background:#fff;border-radius:0 0 30px 30px;box-shadow:0 0 40px rgba(0,0,0,.3);overflow:hidden;position:relative;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
#homeScreen{flex:1;display:flex;flex-direction:column;padding-top:20px;}
h1{text-align:center;margin:0;font-size:26px;color:#007aff;}
.categoryScroll{flex:1;overflow-y:auto;padding:20px;padding-bottom:120px;}
.categoryGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}
.categoryCard{width:130px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 5px 15px rgba(0,0,0,.1);text-align:center;cursor:pointer;transition:.2s;}
.categoryCard:hover{transform:scale(1.03);}
.categoryIcon{font-size:32px;margin-bottom:6px;}
.categoryName{font-size:14px;font-weight:bold;}
.progressBar{width:100%;height:8px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin-top:6px;}
.progressFill{height:8px;background:#007aff;width:0%;}
.progressText{font-size:12px;margin-top:4px;}
#popupOverlay{position:fixed;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(6px);background:rgba(0,0,0,0.4);display:none;justify-content:center;align-items:center;z-index:999;}
#popupWindow{width:300px;background:#fff;border-radius:20px;padding:15px;box-shadow:0 10px 25px rgba(0,0,0,0.3);animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
.popupTitle{text-align:center;font-size:18px;font-weight:bold;margin-bottom:10px;color:#007aff;}
.popupBtn{width:100%;padding:10px;background:#f2f4f7;border:none;border-radius:12px;margin-top:8px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.popupBtn:hover{background:#e0e0e0;}
.closePopup{margin-top:12px;background:#dc3545;color:#fff;padding:10px;}
#quizScreen{display:none;padding:20px;height:100%;overflow-y:auto;}
.card{background:#fff;padding:20px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,.1);}
button.answer{width:100%;padding:12px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:16px;margin-top:10px;cursor:pointer;}
.backBtn{margin-top:20px;background:#dc3545;width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;}
.quizNav{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:360px;background:#fff;border-top:1px solid #ccc;padding:10px;display:flex;justify-content:space-around;z-index:999;}
.navItem{font-size:26px;cursor:pointer;display:flex;align-items:center;gap:6px;color:#007aff;}
#hintCount{color:#000;font-size:14px;font-weight:normal;}
#fixedButtons{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:360px;display:flex;justify-content:space-between;z-index:999;}
#fixedButtons button{flex:1;margin:0 5px;padding:12px;font-size:16px;border:none;border-radius:12px;color:#fff;cursor:pointer;}
#continueBtn{background:#007aff;}
#resetBtn{background:#dc3545;}
</style>
</head>
<body>
<div class="iphone">

<div id="popupOverlay">
  <div id="popupWindow">
    <div class="popupTitle" id="popupTitle"></div>
    <div id="popupButtons"></div>
    <button class="popupBtn closePopup" onclick="closePopup()">❌ Fermer</button>
  </div>
</div>

<div id="homeScreen">
  <h1>Quiz</h1>
  <div class="categoryScroll">
    <div class="categoryGrid" id="categoryGrid"></div>
  </div>
</div>

<div id="fixedButtons">
  <button id="continueBtn" onclick="continueQuiz()">Continuer</button>
  <button id="resetBtn" onclick="resetQuiz()">Reprendre à zéro</button>
</div>

<div id="quizScreen">
  <h2 id="title" style="text-align:center;color:#007aff;"></h2>
  <div class="card">
    <div id="percent"></div>
    <h3 id="questionTitle"></h3>
    <p id="questionText"></p>
    <div id="answers"></div>
    <p id="result"></p>
    <p id="hintBox"></p>
  </div>
  <button class="backBtn" onclick="goHome()">Retour à l'accueil</button>
</div>

<div class="quizNav" id="quizNav" style="display:none;">
  <div class="navItem" onclick="useHint()">💡 <span id="hintCount">0</span></div>
  <div class="navItem" onclick="openSettings()">⚙️</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
let globalHints=parseInt(localStorage.getItem("globalHints")||0);
function updateHintDisplay(){document.getElementById("hintCount").innerText=globalHints;}
function launchConfetti(){confetti({particleCount:120,spread:80,origin:{y:0.6}});}

const subCategories={
  musique:[
    {name:"Années 80",icon:"🎶",sub:"musique80"},
    {name:"Années 90",icon:"🎧",sub:"musique90"},
    {name:"Années 2000",icon:"📀",sub:"musique2000"},
    {name:"Francophone",icon:"🇫🇷",sub:"musiquefr"}
  ],
  cinema:[
    {name:"Action",icon:"🔥",sub:"action"},
    {name:"Comédie",icon:"😂",sub:"comedie"},
    {name:"Drame",icon:"🎭",sub:"drame"}
  ],
  series:[
    {name:"Années 90",icon:"📺",sub:"series90"},
    {name:"Années 2000",icon:"📺",sub:"series2000"},
    {name:"Années 2010",icon:"📺",sub:"series2010"}
  ],
  acteurs:[
    {name:"Hommes",icon:"👨",sub:"acteurs_h"},
    {name:"Femmes",icon:"👩",sub:"acteurs_f"}
  ],
  histoire:[
    {name:"Monde",icon:"🌍",sub:"histoire_monde"},
    {name:"Québec",icon:"⚜️",sub:"histoire_quebec"},
    {name:"USA",icon:"🇺🇸",sub:"histoire_usa"}
  ],
  faitsdivers:[
    {name:"Faits divers",icon:"📰",sub:"FaitsDivers"}
  ]
};

const jsonFiles={
  musique:"musique.json",
  cinema:"cinema.json",
  series:"series.json",
  acteurs:"acteurs.json",
  histoire:"histoire.json",
  faitsdivers:"faitsdivers.json"
};

function openPopup(cat){
  const titles={
    musique:"Musique 🎵",
    cinema:"Cinéma 🎬",
    series:"Séries TV 📺",
    acteurs:"Acteurs 🎭",
    histoire:"Histoire 📜",
    faitsdivers:"Faits divers 📰"
  };
  document.getElementById("popupTitle").innerText=titles[cat]||cat;
  let buttons="";
  subCategories[cat].forEach(sub=>{
    buttons+=`<button class="popupBtn" onclick="startCategory('${cat}','${sub.sub}')">${sub.icon} ${sub.name}</button>`;
  });
  document.getElementById("popupButtons").innerHTML=buttons;
  document.getElementById("popupOverlay").style.display="flex";
}
function closePopup(){document.getElementById("popupOverlay").style.display="none";}

const categories=[
  {id:"musique",name:"Musique",icon:"🎵"},
  {id:"cinema",name:"Cinéma",icon:"🎬"},
  {id:"series",name:"Séries TV",icon:"📺"},
  {id:"acteurs",name:"Acteurs",icon:"🎭"},
  {id:"histoire",name:"Histoire",icon:"📜"},
  {id:"faitsdivers",name:"Faits divers",icon:"📰"}
];

function loadHome(){
  updateHintDisplay();
  const grid=document.getElementById("categoryGrid");
  grid.innerHTML="";
  categories.forEach(cat=>{
    let percent=0;
    if(subCategories[cat.id]&&subCategories[cat.id].length>0){
      let total=0,count=0;
      subCategories[cat.id].forEach(sub=>{
        total+=parseInt(localStorage.getItem(sub.sub+"_percent")||0);
        count++;
      });
      percent=Math.floor(total/count);
    }else{
      percent=parseInt(localStorage.getItem(cat.id+"_percent")||0);
    }
    let div=document.createElement("div");
    div.className="categoryCard";
    div.innerHTML=`
      <div class="categoryIcon">${cat.icon}</div>
      <div class="categoryName">${cat.name}</div>
      <div class="progressBar"><div class="progressFill" style="width:${percent}%"></div></div>
      <div class="progressText">${percent}% complété</div>
    `;
    div.onclick=()=>openPopup(cat.id);
    grid.appendChild(div);
  });
}

let questions=[],index=0,correctCount=0,currentSub="";

async function startCategory(category,sub){
  closePopup();
  currentSub=sub;
  document.getElementById("homeScreen").style.display="none";
  document.getElementById("quizScreen").style.display="block";
  document.getElementById("quizNav").style.display="flex";
  document.getElementById("title").innerText=category+" - "+sub;
  const url=`${jsonFiles[category]}`;
  const response=await fetch(url);
  const text=await response.text();
  const lines=text.trim().split("\n");
  let allQuestions=lines.map(l=>JSON.parse(l));
  questions=allQuestions.filter(q=>q.cat===sub);
  index=0;
  correctCount=0;
  loadQuestion();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j]];}return a;}

function loadQuestion(){
  if(index>=questions.length){endQuiz();return;}
  let q=questions[index];
  let percent=Math.floor((index/questions.length)*100);
  if(currentSub)localStorage.setItem(currentSub+"_percent",percent);
  document.getElementById("percent").innerText="Progression : "+percent+"%";
  document.getElementById("questionTitle").innerText="Question "+(index+1);
  document.getElementById("questionText").innerText=q.q;
  let answersDiv=document.getElementById("answers");
  answersDiv.innerHTML="";
  shuffle([...q.a]).forEach(ans=>{
    let btn=document.createElement("button");
    btn.className="answer";
    btn.innerText=ans;
    btn.onclick=()=>check(ans);
    answersDiv.appendChild(btn);
  });
  document.getElementById("result").innerText="";
  document.getElementById("hintBox").innerText="";
}

function check(answer){
  let q=questions[index];
  let result=document.getElementById("result");
  if(answer===q.correct){
    result.style.color="green";
    result.innerText="Bonne réponse !";
    correctCount++;
    if(correctCount===50||correctCount===100||correctCount===150){
      globalHints++;
      localStorage.setItem("globalHints",globalHints);
      updateHintDisplay();
      launchConfetti();
    }
  }else{
    result.style.color="red";
    result.innerText="Mauvaise réponse.";
  }
  setTimeout(()=>{index++;loadQuestion();},800);
}

function useHint(){
  if(globalHints<=0){alert("Tu n'as aucun indice disponible.");return;}
  let q=questions[index];
  document.getElementById("hintBox").innerText="Indice : "+q.hint;
  globalHints--;
  localStorage.setItem("globalHints",globalHints);
  updateHintDisplay();
}

function openSettings(){alert("Paramètres : thèmes de couleur bientôt disponibles.");}
function endQuiz(){document.getElementById("questionText").innerText="Quiz terminé !";document.getElementById("answers").innerHTML="";}
function goHome(){document.getElementById("quizScreen").style.display="none";document.getElementById("quizNav").style.display="none";document.getElementById("homeScreen").style.display="block";loadHome();}
function continueQuiz(){loadQuestion();}
function resetQuiz(){index=0;correctCount=0;loadQuestion();}

loadHome();
</script>
</div>
</body>
</html>
