<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Quiz</title>
<link rel="apple-touch-icon" href="Quiz.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body{
  margin:0;
  background:#f2f4f7;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CONTENEUR PRINCIPAL */
.iphone{
  width:390px;
  height:100vh;
  background:#fff;
  border-radius:0 0 30px 30px;
  box-shadow:0 0 40px rgba(0,0,0,.3);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ACCUEIL */
#homeScreen{
  flex:1;
  display:flex;
  flex-direction:column;
  padding-top:20px;
}

h1{
  text-align:center;
  margin:0;
  font-size:26px;
  color:#007aff;
}

.categoryScroll{
  flex:1;
  overflow-y:auto;
  padding:20px;
  padding-bottom:140px;
}

.categoryGrid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.categoryCard{
  width:130px;
  background:#fff;
  border-radius:20px;
  padding:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.categoryCard:hover{
  transform:scale(1.03);
}

.categoryCard.selected{
  background:#c8f7c5;
  border:2px solid #4CAF50;
}

.categoryIcon{
  font-size:32px;
  margin-bottom:6px;
}

.categoryName{
  font-size:14px;
  font-weight:bold;
}

.progressBar{
  width:100%;
  height:8px;
  background:#e0e0e0;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.progressFill{
  height:8px;
  background:#007aff;
  width:0%;
}

.progressText{
  font-size:12px;
  margin-top:4px;
}

/* BOUTONS FIXES ACCUEIL */
.bottomButtons{
  position:fixed;
  bottom:env(safe-area-inset-bottom);
  left:50%;
  transform:translateX(-50%);
  width:360px;
  background:#fff;
  border-top:1px solid #ccc;
  padding:12px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.bottomButtons button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.bottomButtons .reset{
  background:#dc3545;
}

/* QUIZ */
#quizScreen{
  display:none;
  padding:20px;
  height:100%;
  overflow-y:auto;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button.answer{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}

.backBtn{
  margin-top:20px;
  background:#dc3545;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

/* BARRE DE NAVIGATION DU QUIZ */
.quizNav{
  position:fixed;
  bottom:env(safe-area-inset-bottom);
  left:50%;
  transform:translateX(-50%);
  width:360px;
  background:#fff;
  border-top:1px solid #ccc;
  padding:10px;
  display:flex;
  justify-content:space-around;
}

.navItem{
  font-size:26px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  color:#007aff;
}

#hintCount{
  color:#000;
  font-size:14px;
  font-weight:normal;
}
</style>
</head>

<body>
<div class="iphone">

<!-- ACCUEIL -->
<div id="homeScreen">
  <h1>Quiz</h1>

  <div class="categoryScroll">
    <div class="categoryGrid" id="categoryGrid"></div>
  </div>

  <div class="bottomButtons">
    <button onclick="continueCategory()">Continuer</button>
    <button class="reset" onclick="resetCategory()">Reprendre à zéro</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quizScreen">
  <h2 id="title" style="text-align:center;color:#007aff;"></h2>

  <div class="card">
    <div id="percent"></div>
    <h3 id="questionTitle"></h3>
    <p id="questionText"></p>
    <div id="answers"></div>
    <p id="result"></p>
    <p id="hintBox"></p>
  </div>

  <button class="backBtn" onclick="goHome()">Retour à l'accueil</button>
</div>

<!-- BARRE DE NAVIGATION DU QUIZ -->
<div class="quizNav" id="quizNav" style="display:none;">
  <div class="navItem" onclick="useHint()">
    💡 <span id="hintCount">0</span>
  </div>
  <div class="navItem" onclick="openSettings()">
    ⚙️
  </div>
</div>

</div>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ---------------------- INDICES GLOBAUX ---------------------- */

let globalHints = parseInt(localStorage.getItem("globalHints") || 0);

function updateHintDisplay(){
  document.getElementById("hintCount").innerText = globalHints;
}

function launchConfetti(){
  confetti({
    particleCount: 120,
    spread: 80,
    origin: { y: 0.6 }
  });
}

/* ---------------------- ACCUEIL ---------------------- */

const categories = [
  {id:"musique", name:"Musique", icon:"🎵"},
  {id:"cinema", name:"Cinéma", icon:"🎬"},
  {id:"series", name:"Séries TV", icon:"📺"},
  {id:"acteurs", name:"Acteurs", icon:"🎭"},
  {id:"histoire", name:"Histoire", icon:"📜"},
  {id:"faits", name:"Faits divers", icon:"📰"}
];

let selectedCategory = null;

function loadHome(){
  updateHintDisplay();

  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";

  categories.forEach(cat=>{
    let percent = localStorage.getItem(cat.id+"_percent") || 0;

    let div = document.createElement("div");
    div.className="categoryCard";
    div.id = "cat_" + cat.id;

    div.innerHTML = `
      <div class="categoryIcon">${cat.icon}</div>
      <div class="categoryName">${cat.name}</div>

      <div class="progressBar">
        <div class="progressFill" style="width:${percent}%"></div>
      </div>

      <div class="progressText">${percent}% complété</div>
    `;

    div.onclick = ()=>selectCategory(cat.id);

    grid.appendChild(div);
  });
}

function selectCategory(cat){
  selectedCategory = cat;

  document.querySelectorAll(".categoryCard").forEach(c=>{
    c.classList.remove("selected");
  });

  document.getElementById("cat_"+cat).classList.add("selected");
}

function continueCategory(){
  if(!selectedCategory){
    alert("Sélectionne une catégorie.");
    return;
  }

  startQuiz(selectedCategory, false);
}

function resetCategory(){
  if(!selectedCategory){
    alert("Sélectionne une catégorie.");
    return;
  }

  localStorage.setItem(selectedCategory+"_index", 0);
  localStorage.setItem(selectedCategory+"_percent", 0);
  localStorage.setItem(selectedCategory+"_correct", 0);

  startQuiz(selectedCategory, true);
}

/* ---------------------- QUIZ ---------------------- */

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let cat = "";
let index = 0;
let questions = [];
let correctCount = 0;

function startQuiz(category, reset){
  cat = category;

  if(reset){
    index = 0;
    correctCount = 0;
  } else {
    index = parseInt(localStorage.getItem(cat+"_index") || 0);
    correctCount = parseInt(localStorage.getItem(cat+"_correct") || 0);
  }

  document.getElementById("homeScreen").style.display="none";
  document.getElementById("quizScreen").style.display="block";
  document.getElementById("quizNav").style.display="flex";

  loadQuiz();
}

async function loadQuiz(){
  document.getElementById("title").innerText = "Catégorie : " + cat;

  const url = `https://raw.githubusercontent.com/pierrenormand908-hub/Quiz/main/question_${cat}1.json`;
  const response = await fetch(url);
  let data = await response.json();

  if(data.musique) data = data.musique;
  if(data.questions) data = data.questions;

  questions = shuffle(data);

  loadQuestion();
}

function loadQuestion(){
  if(index >= questions.length){
    endQuiz();
    return;
  }

  let q = questions[index];

  let percent = Math.floor((index / questions.length) * 100);
  localStorage.setItem(cat+"_percent", percent);

  document.getElementById("percent").innerText = "Progression : " + percent + "%";
  document.getElementById("questionTitle").innerText = "Question " + (index+1);
  document.getElementById("questionText").innerText = q.q;

  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  shuffle([...q.a]).forEach(ans=>{
    let btn = document.createElement("button");
    btn.className="answer";
    btn.innerText=ans;
    btn.onclick=()=>check(ans);
    answersDiv.appendChild(btn);
  });

  document.getElementById("result").innerText="";
  document.getElementById("hintBox").innerText="";
}

function check(answer){
  let q = questions[index];
  let result = document.getElementById("result");

  if(answer === q.correct){
    result.style.color="green";
    result.innerText="Bonne réponse !";
    correctCount++;
    localStorage.setItem(cat+"_correct", correctCount);

    if(correctCount === 50 || correctCount === 100 || correctCount === 150){
      globalHints++;
      localStorage.setItem("globalHints", globalHints);
      updateHintDisplay();
      launchConfetti();
    }

  } else {
    result.style.color="red";
    result.innerText="Mauvaise réponse.";
  }

  setTimeout(()=>{
    index++;
    localStorage.setItem(cat+"_index", index);
    loadQuestion();
  },800);
}

function useHint(){
  if(globalHints <= 0){
    alert("Tu n'as aucun indice disponible.");
    return;
  }

  let q = questions[index];
  document.getElementById("hintBox").innerText = "Indice : " + q.hint;

  globalHints--;
  localStorage.setItem("globalHints", globalHints);
  updateHintDisplay();
}

function openSettings(){
  alert("Paramètres : thèmes de couleur bientôt disponibles.");
}

function endQuiz(){
  document.getElementById("questionText").innerText = "Quiz terminé !";
  document.getElementById("answers").innerHTML="";
  localStorage.setItem(cat+"_index", 0);
}

function goHome(){
  document.getElementById("quizScreen").style.display="none";
  document.getElementById("quizNav").style.display="none";
  document.getElementById("homeScreen").style.display="block";
  loadHome();
}

loadHome();
</script>

</body>
</html>
