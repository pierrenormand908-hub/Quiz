<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quiz iPhone</title>
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body{
  margin:0;
  background:#f2f4f7;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.iphone{
  width:390px;
  height:100vh;
  background:#fff;
  border-radius:30px;
  box-shadow:0 0 40px rgba(0,0,0,.3);
  overflow:hidden;
  position:relative;
}

/* ACCUEIL */
#homeScreen{
  height:100%;
  display:flex;
  flex-direction:column;
  padding-top:40px; /* DESCEND le mot Quiz */
}

h1{
  text-align:center;
  margin:0;
  font-size:26px;
  color:#007aff;
}

/* Zone scrollable */
.categoryScroll{
  flex:1;
  overflow-y:auto;
  padding:20px;
  padding-bottom:140px; /* espace pour les boutons fixes */
}

/* Catégories */
.categoryGrid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.categoryCard{
  width:130px; /* PLUS PETIT */
  background:#fff;
  border-radius:20px;
  padding:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.categoryCard:hover{
  transform:scale(1.03);
}

.categoryCard.selected{
  background:#c8f7c5;
  border:2px solid #4CAF50;
}

.categoryIcon{
  font-size:32px;
  margin-bottom:6px;
}

.categoryName{
  font-size:14px;
  font-weight:bold;
}

.progressBar{
  width:100%;
  height:8px;
  background:#e0e0e0;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.progressFill{
  height:8px;
  background:#007aff;
  width:0%;
}

.progressText{
  font-size:12px;
  margin-top:4px;
}

/* BOUTONS FIXES */
.bottomButtons{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:360px; /* MOINS LARGE QUE 390px */
  background:#fff;
  border-top:1px solid #ccc;
  padding:12px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.bottomButtons button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.bottomButtons .reset{
  background:#dc3545;
}

/* QUIZ */
#quizScreen{
  display:none;
  padding:20px;
  height:100%;
  overflow-y:auto;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button.answer{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}

.backBtn{
  margin-top:20px;
  background:#dc3545;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="iphone">

<!-- ACCUEIL -->
<div id="homeScreen">
  <h1>Quiz</h1>

  <div class="categoryScroll">
    <div class="categoryGrid" id="categoryGrid"></div>
  </div>

  <div class="bottomButtons">
    <button onclick="continueCategory()">Continuer</button>
    <button class="reset" onclick="resetCategory()">Reprendre à zéro</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quizScreen">
  <h2 id="title" style="text-align:center;color:#007aff;"></h2>

  <div class="card">
    <div id="percent"></div>
    <h3 id="questionTitle"></h3>
    <p id="questionText"></p>
    <div id="answers"></div>
    <p id="result"></p>
    <p id="hintBox"></p>
  </div>

  <button class="backBtn" onclick="goHome()">Retour à l'accueil</button>
</div>

</div>

<script>
/* ---------------------- ACCUEIL ---------------------- */

const categories = [
  {id:"musique", name:"Musique", icon:"🎵"},
  {id:"cinema", name:"Cinéma", icon:"🎬"},
  {id:"series", name:"Séries TV", icon:"📺"},
  {id:"acteurs", name:"Acteurs", icon:"🎭"},
  {id:"histoire", name:"Histoire", icon:"📜"},
  {id:"faits", name:"Faits divers", icon:"📰"}
];

let selectedCategory = null;

function loadHome(){
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";

  categories.forEach(cat=>{
    let percent = localStorage.getItem(cat.id+"_percent") || 0;

    let div = document.createElement("div");
    div.className="categoryCard";
    div.id = "cat_" + cat.id;

    div.innerHTML = `
      <div class="categoryIcon">${cat.icon}</div>
      <div class="categoryName">${cat.name}</div>

      <div class="progressBar">
        <div class="progressFill" style="width:${percent}%"></div>
      </div>

      <div class="progressText">${percent}% complété</div>
    `;

    div.onclick = ()=>selectCategory(cat.id);

    grid.appendChild(div);
  });
}

function selectCategory(cat){
  selectedCategory = cat;

  document.querySelectorAll(".categoryCard").forEach(c=>{
    c.classList.remove("selected");
  });

  document.getElementById("cat_"+cat).classList.add("selected");
}

function continueCategory(){
  if(!selectedCategory){
    alert("Sélectionne une catégorie.");
    return;
  }

  startQuiz(selectedCategory, false);
}

function resetCategory(){
  if(!selectedCategory){
    alert("Sélectionne une catégorie.");
    return;
  }

  localStorage.setItem(selectedCategory+"_index", 0);
  localStorage.setItem(selectedCategory+"_percent", 0);

  startQuiz(selectedCategory, true);
}

/* ---------------------- QUIZ ---------------------- */

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let cat = "";
let index = 0;
let questions = [];

function startQuiz(category, reset){
  cat = category;

  if(reset){
    index = 0;
  } else {
    index = parseInt(localStorage.getItem(cat+"_index") || 0);
  }

  document.getElementById("homeScreen").style.display="none";
  document.getElementById("quizScreen").style.display="block";

  loadQuiz();
}

async function loadQuiz(){
  document.getElementById("title").innerText = "Catégorie : " + cat;

  const url = `https://raw.githubusercontent.com/pierrenormand908-hub/Quiz/main/question_${cat}1.json`;
  const response = await fetch(url);
  let data = await response.json();

  if(data.musique) data = data.musique;
  if(data.questions) data = data.questions;

  questions = shuffle(data);

  loadQuestion();
}

function loadQuestion(){
  if(index >= questions.length){
    endQuiz();
    return;
  }

  let q = questions[index];

  let percent = Math.floor((index / questions.length) * 100);
  localStorage.setItem(cat+"_percent", percent);

  document.getElementById("percent").innerText = "Progression : " + percent + "%";
  document.getElementById("questionTitle").innerText = "Question " + (index+1);
  document.getElementById("questionText").innerText = q.q;

  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  shuffle([...q.a]).forEach(ans=>{
    let btn = document.createElement("button");
    btn.className="answer";
    btn.innerText=ans;
    btn.onclick=()=>check(ans);
    answersDiv.appendChild(btn);
  });

  document.getElementById("result").innerText="";
  document.getElementById("hintBox").innerText="";
}

function check(answer){
  let q = questions[index];
  let result = document.getElementById("result");

  if(answer === q.correct){
    result.style.color="green";
    result.innerText="Bonne réponse !";
  } else {
    result.style.color="red";
    result.innerText="Mauvaise réponse.";
  }

  setTimeout(()=>{
    index++;
    localStorage.setItem(cat+"_index", index);
    loadQuestion();
  },800);
}

function endQuiz(){
  document.getElementById("questionText").innerText = "Quiz terminé !";
  document.getElementById("answers").innerHTML="";
  localStorage.setItem(cat+"_index", 0);
}

function goHome(){
  document.getElementById("quizScreen").style.display="none";
  document.getElementById("homeScreen").style.display="block";
  loadHome();
}

loadHome();
</script>

</body>
</html>
